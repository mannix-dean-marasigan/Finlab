# Builds FINLAB and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Source must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Database integration tests
        run: npm run test:db
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public client values only (safe in a public repo — data is protected by RLS).
          # Override with repository variables if the Supabase project changes.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bocqcsjgbryclvcqjvrs.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_bE8E_pHN9M4KJtGRbzCl8w_4dxE6fu2' }}
        run: npm run build
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
